# herd-wake sample configuration
#
# Copy this file to:
#
#   ~/Library/Application Support/herd-wake/config.yaml
#
# and adjust it for your projects. herd-wake reads this user-level file only;
# nothing is stored inside your project repositories.
#
# Each entry under `projects:` registers one Node.js dev server. For every
# project you also register a Herd proxy pointing the public URL at the
# project's supervisor port, e.g.:
#
#   herd proxy dashboard http://127.0.0.1:7101 --secure
#   herd proxy vite.accounts http://127.0.0.1:7102 --secure
#
# Additional projects may live in one file each under a projects.d directory
# next to this file (~/Library/Application Support/herd-wake/projects.d/
# *.yaml, same layout: a `projects:` map per file, one project or many). They
# are merged into this file's projects; a name defined twice anywhere is an
# error. Tooling that registers projects automatically writes there, so this
# hand-written file is never rewritten.
#
# A running daemon picks up edits with `herd-wake reload` (or SIGHUP):
# projects whose settings did not change are left completely alone.
#
# Conventions used below: supervisor ports in the 71xx range, application
# ports in the 171xx range. Any free high-numbered loopback ports work; every
# application_port must be unique across the whole configuration, and so
# must every supervisor_port — except that projects which all set `host`
# may share one (example 3).

projects:
  # ---------------------------------------------------------------------
  # Example 1: a Node-only application (Next.js, Vite SPA, Express, ...).
  # Visiting https://dashboard.test starts the dev server on demand.
  # ---------------------------------------------------------------------
  dashboard:
    # Required. The public Herd URL that fronts this project. Herd terminates
    # HTTPS and forwards requests to the supervisor port below.
    public_url: https://dashboard.test

    # Required. The loopback port the supervisor listens on for this project.
    # This is the port you point `herd proxy` at.
    supervisor_port: 7101

    # Required. The loopback port the dev server itself listens on. The
    # supervisor proxies traffic here once the server is ready.
    application_port: 17101

    # Required. The directory the command runs in. Must exist. A leading
    # "~/" is expanded to your home directory.
    working_directory: ~/Code/dashboard

    # Required. The dev-server command, run via `/bin/sh -c` from
    # working_directory (so quoting, $VARS, and && chains behave like your
    # terminal) in its own process group. Its combined stdout/stderr is
    # captured to ~/Library/Application Support/herd-wake/logs/<name>.log.
    # Pin it to application_port and make the port strict so a port conflict
    # fails fast instead of drifting to another port. Make the server bind
    # 127.0.0.1 explicitly: herd-wake proxies (and probes readiness) at
    # 127.0.0.1, and some servers — Vite included — otherwise bind only
    # ::1/localhost.
    command: npm run dev -- --host 127.0.0.1 --port 17101 --strictPort

    # Optional. How readiness is detected before queued requests are
    # forwarded: "http" polls readiness_url, "tcp" dials application_port.
    # Default: http.
    readiness_strategy: http

    # Optional. The URL polled when readiness_strategy is "http".
    # Default: http://127.0.0.1:<application_port>/
    readiness_url: http://127.0.0.1:17101/

    # Optional. How long a cold start may take before it is declared failed.
    # Default: 60.
    startup_timeout_seconds: 60

    # Optional. Requests that arrive while the project is starting are held
    # and forwarded once the server is ready (the client just sees a slower
    # first response). hold_max_wait_seconds bounds how long one held request
    # may wait (default: startup_timeout_seconds + 5, so the request outlives
    # the startup attempt and sees its real outcome). hold_max_requests bounds
    # how many requests may be held at once (default: 100). A request over
    # either limit receives a 503 explaining the breach. Held request bodies
    # are never buffered by herd-wake: they are streamed to the dev server
    # only once it is ready.
    hold_max_wait_seconds: 65
    hold_max_requests: 100

    # Optional. Stop the dev server after this many minutes without activity
    # (requests or protected WebSocket connections). The countdown only runs
    # while nothing is in flight: a long-running request — or an activity
    # lease taken with `herd-wake project:lease` — holds the stop off
    # entirely, and every completed request restarts the full window.
    # Default: 15.
    idle_timeout_minutes: 15

    # Optional. Seconds-granularity idle timeout that takes precedence over
    # idle_timeout_minutes when set. Primarily a testing hook; prefer
    # idle_timeout_minutes.
    # idle_timeout_seconds: 90

    # Optional. Extra environment variables for the dev server.
    env:
      APP_ENV: local

    # Optional. Absolute path to the node executable to put first on PATH,
    # for projects pinned to a specific Node version. Default: whatever
    # `node` resolves to.
    # node_path: /opt/homebrew/opt/node@22/bin/node

  # ---------------------------------------------------------------------
  # Example 2: the Vite dev server of a Laravel project.
  #
  # The Laravel app itself stays a normal Herd PHP site at
  # https://accounts.test — herd-wake never touches it. Only the Vite server
  # is registered here, behind a stable proxy URL that Laravel's Vite
  # integration should reference instead of a direct port. The first asset
  # or HMR request to https://vite.accounts.test starts Vite automatically.
  # ---------------------------------------------------------------------
  accounts-vite:
    public_url: https://vite.accounts.test
    supervisor_port: 7102
    application_port: 17102
    working_directory: ~/Code/accounts
    command: npm run dev -- --host 127.0.0.1 --port 17102 --strictPort
    idle_timeout_minutes: 30

    # Optional. Present the dev server with `Host: 127.0.0.1:<application_port>`
    # instead of the public host (vite.accounts.test). Vite 5.4.12+/6.0.9+
    # and webpack-dev-server refuse requests for hosts outside their
    # allowedHosts list (Vite answers "403 Blocked request. This host is not
    # allowed."); with rewrite_host the server only ever sees its own
    # loopback address, so no allowedHosts entry is needed. The public host
    # is still passed along in X-Forwarded-Host (and X-Forwarded-Proto stays
    # https), and the rewrite applies to WebSocket/HMR upgrades too. Leave it
    # false for servers that build absolute URLs from the Host header.
    # Default: false.
    rewrite_host: false

    # Optional. Whether open WebSocket connections (such as Vite HMR) keep
    # the project from being considered idle. Default: true — the project is
    # never idle-stopped while at least one socket is open, and the last
    # socket closing starts a fresh idle window. Set to false to idle out on
    # HTTP activity alone: an upgrade then counts only as momentary activity,
    # and an idle stop closes any still-open sockets (auto-reconnecting
    # clients like Vite HMR will cold-start the project again on demand).
    websockets_keep_alive: true

    # Optional. Signal sent for graceful shutdown, and how long to wait for
    # the process group to exit before it is force-killed. Defaults: SIGTERM
    # and 10 seconds. Allowed signals: SIGTERM, SIGINT, SIGQUIT, SIGHUP,
    # SIGUSR1, SIGUSR2, SIGKILL.
    shutdown_signal: SIGTERM
    shutdown_timeout_seconds: 10

    # Optional. Keep this project running permanently: it starts as soon as
    # the daemon starts (a failed start is logged and retried on demand, and
    # never keeps the daemon from running) and is never idle-stopped. Manual
    # project:stop/project:restart still work. Default: false.
    always_on: false

    # Optional. How many days of process logs to keep. Default: 7.
    log_retention_days: 7

    # Optional. The address the supervisor listener binds for this project.
    # Default: 127.0.0.1. Non-loopback addresses are rejected unless you
    # explicitly opt in with allow_non_loopback: true.
    listen_host: 127.0.0.1
    # allow_non_loopback: false

  # ---------------------------------------------------------------------
  # Example 3: several projects sharing one supervisor port, routed by the
  # request's Host header. Useful behind a wildcard proxy that must never
  # be reconfigured per project — nginx on a preview box forwarding
  # *.preview.example.com to one port, say, or a Herd proxy for a parent
  # site. A hostname no project claims gets a 404 diagnostic naming it.
  # ---------------------------------------------------------------------
  preview-alpha:
    # Optional. The exact hostname this project answers to (compared
    # case-insensitively, without the port). Projects that set host may
    # share a supervisor_port; a port is used either by exactly one
    # project without host, or only by projects that all set host (with
    # distinct hosts and the same listen_host). public_url defaults to
    # https://<host> when host is set.
    host: alpha.preview.example.com
    supervisor_port: 7103
    application_port: 17103
    working_directory: ~/previews/alpha
    command: node --import tsx src/server.ts
    env:
      SYP_SERVER_PORT: "17103"
  preview-beta:
    host: beta.preview.example.com
    supervisor_port: 7103               # shared with preview-alpha
    application_port: 17104
    working_directory: ~/previews/beta
    command: node --import tsx src/server.ts
    env:
      SYP_SERVER_PORT: "17104"

# -----------------------------------------------------------------------
# Worktree discovery: automatic URLs for git worktrees.
#
# Each entry under `discovery:` is a template for one family of worktrees
# (one directory per branch under a workspace folder). Two modes:
#
#   wildcard (recommended): the daemon binds ONE supervisor_port for the
#     entry and serves https://<label>.<base_domain> from
#     <directory>/<label> on demand — the worktree is resolved from the
#     request's Host header the first time it is asked for, becomes a
#     project in memory, and is forgotten when its directory disappears.
#     `herd-wake sync` runs exactly one Herd command, once:
#     `herd proxy <base name> http://127.0.0.1:<supervisor_port> --secure`
#     (Herd's site file and certificate cover *.<base_domain>). Creating or
#     deleting a worktree needs no sync, reload, or watcher.
#
#   proxy (the default): `herd-wake sync` scans the directory and writes
#     one generated project per worktree — the template's fields plus a
#     generated public_url, supervisor_port, application_port, and
#     working_directory — to projects.d/<name>.yaml (a file it owns; never
#     edit it), registers a Herd proxy per worktree (each `herd proxy`
#     restarts Herd's nginx), and reloads the daemon. Deleting a worktree
#     and syncing again removes its project and proxy. Ports are allocated
#     once and never change afterwards.
#
# In both modes a name is refused — never proxied — when it would shadow an
# existing Herd site: a directory of that name inside a parked path
# (`herd paths`), a linked site (`herd links`), or a non-proxy site file.
# In wildcard mode the check applies to the base name.
# -----------------------------------------------------------------------
discovery:
  # ---------------------------------------------------------------------
  # Wildcard mode: https://<worktree>.webapp.test for every worktree under
  # ~/Code/worktrees, through one listener on port 41000.
  # ---------------------------------------------------------------------
  - # Required. Identifies the entry. A DNS label (lowercase letters,
    # digits, hyphens). In wildcard mode it is the default base_domain's
    # first label (<name>.test).
    name: webapp

    # Optional. "wildcard" or "proxy". Default: proxy.
    mode: wildcard

    # Optional (wildcard mode). The domain worktrees are served under: the
    # worktree <directory>/<label> answers at https://<label>.<base_domain>.
    # At least two labels; the Herd site is the domain without its TLD
    # (webapp.test -> `herd proxy webapp ...`, which covers *.webapp.test).
    # Default: <name>.test
    base_domain: webapp.test

    # Required (wildcard mode). The one loopback port the entry's shared
    # listener binds — the `herd proxy` target. It is the entry's own: no
    # project or other entry may use it.
    supervisor_port: 41000

    # Required. The directory holding the worktrees; <directory>/<label>
    # is what a request for <label>.<base_domain> resolves to. Must exist.
    # A leading "~/" is expanded.
    directory: ~/Code/worktrees

    # Optional. Only linked worktrees of this repository are served (the
    # subdirectory's .git *file* must point into <repository>/.git/
    # worktrees/). Unrelated repositories checked out in the same folder —
    # asset or data repos, say — get a 404. Without it, every subdirectory
    # holding a .git file or directory is a candidate.
    repository: ~/Code/webapp

    # Optional. Only subdirectories containing all of these files are
    # served; others get a 404 naming the missing file.
    require_files: [package.json]

    # Required (a template field). The command run in each worktree, via
    # /bin/sh -c from the worktree itself. It must make the dev server
    # listen on 127.0.0.1:<application_port>. Because that port differs per
    # worktree, the command usually computes it the same way port_command
    # does (a script that derives it from the worktree name, a per-worktree
    # .env, ...) instead of hard-coding it.
    command: ./start.sh

    # Optional. Run in the worktree (via /bin/sh -c, with the env below and
    # node_path on PATH, 15 s timeout) when the worktree is first served
    # and again on `project:restart`; it prints the port the dev server
    # will listen on — as a bare number or a URL — and that becomes
    # application_port. A failure is a 503 diagnostic quoting the output,
    # retried with backoff. Without port_command, application_port is the
    # lowest port of application_port_range no live project uses.
    port_command: node scripts/dev-port.mjs

    # Optional; required without port_command.
    application_port_range: [42000, 42999]

    # Optional. Let sync manage the wildcard Herd proxy. Default: true.
    # With false (or when the herd CLI cannot be found), sync prints the
    # command for you to run instead.
    herd: true

    # Optional. Glob patterns on the subdirectory name; matches are never
    # served. Default: [".*"] (dot-directories). Setting it replaces the
    # default, so include ".*" yourself if you still want it.
    exclude: [".*", "node_modules"]

    # Any other per-project field is accepted here and copied verbatim to
    # every worktree project: env, node_path, rewrite_host,
    # readiness_strategy, startup_timeout_seconds, idle_timeout_minutes,
    # websockets_keep_alive, shutdown_*, log_retention_days, always_on,
    # hold_*, listen_host, ... public_url, host, application_port, and
    # working_directory are generated and therefore rejected in a template.
    env:
      ENVIRONMENT: dev
    rewrite_host: true
    readiness_strategy: tcp
    startup_timeout_seconds: 180
    idle_timeout_minutes: 30

  # ---------------------------------------------------------------------
  # Proxy mode: one project, port, and Herd proxy per worktree, kept in
  # projects.d/legacy.yaml by `herd-wake sync`. Use it when worktrees need
  # flat https://<worktree>.test URLs (any url_template) or a port each.
  # ---------------------------------------------------------------------
  - # Required. Identifies the entry; its projects live in
    # projects.d/legacy.yaml.
    name: legacy

    # Required. The directory whose immediate subdirectories are scanned.
    directory: ~/Code/legacy-worktrees

    # Optional. See above.
    repository: ~/Code/legacy
    require_files: [package.json]

    # Optional. The public_url of each project; {name} is the subdirectory
    # name, so the worktree "issue-3265" gets https://issue-3265.test.
    # Default: https://{name}.test
    url_template: https://{name}.test

    # Required. See above.
    command: ./start.sh

    # Optional. Run in the worktree on every sync; a changed port updates
    # the project. If it fails, the worktree is skipped this time (an
    # already-registered one keeps its previous settings).
    port_command: node scripts/dev-port.mjs

    # Ranges to allocate ports from: a new project gets the lowest port not
    # used anywhere in the configuration (config.yaml and every projects.d
    # file), and keeps it for good. supervisor_port_range is required in
    # proxy mode; application_port_range is used only when port_command is
    # absent.
    supervisor_port_range: [43000, 43999]
    application_port_range: [44000, 44999]

    # Optional. Manage Herd proxy entries for these projects: `herd proxy`
    # for new ones, `herd unproxy` for removed ones. Default: true.
    herd: true

    # Optional. See above.
    exclude: [".*", "node_modules"]

    # Template fields, copied to every generated project (see above).
    env:
      ENVIRONMENT: dev
    rewrite_host: true
    readiness_strategy: tcp
    startup_timeout_seconds: 180
    idle_timeout_minutes: 30
